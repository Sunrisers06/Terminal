name: Yahoo fill

# Runs "python yahoo_fill.py all" Monday–Saturday around 6 PM IST, with two
# backup runs later in the evening. GitHub may delay or silently drop a
# scheduled run when its servers are busy, so one cron alone is not reliable.
# The backups are cheap: once a run has succeeded, nothing is stale any more,
# so a later run fetches almost nothing and commits nothing.
# It only touches tickers that OHLC.parquet does NOT have:
#   clean  – drops Yahoo data for tickers that OHLC.parquet now has
#   update – refreshes Yahoo tickers whose data is out of date
#   new    – downloads full history for newly missing tickers
# Commits Yahoo_OHLC.parquet + Yahoo_OHLC_meta.json only when something changed.

on:
  schedule:
    # Odd minutes on purpose: GitHub is busiest at :00 and :30.
    - cron: '7 12 * * 1-6'        # 12:07 UTC = 17:37 IST, Mon–Sat (main run)
    - cron: '43 14 * * 1-6'       # 14:43 UTC = 20:13 IST (backup)
    - cron: '19 17 * * 1-6'       # 17:19 UTC = 22:49 IST (backup)
  workflow_dispatch:              # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: yahoo-fill
  cancel-in-progress: false

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install packages
        run: pip install pandas pyarrow requests

      - name: Run yahoo_fill.py all
        run: python yahoo_fill.py all

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add Yahoo_OHLC.parquet Yahoo_OHLC_meta.json
          if git diff --cached --quiet; then
            echo "No changes to push."
            exit 0
          fi
          git commit -m "Yahoo fill update — $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then echo "Pushed."; exit 0; fi
            echo "Push rejected (main moved); rebasing and retrying…"
            git fetch --depth 50 origin main
            git rebase origin/main
            sleep 10
          done
          echo "Could not push after 5 attempts." && exit 1
